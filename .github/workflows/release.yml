name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tests/acun_remote/run.py
      - run: python3 -m unittest discover -s tests/scripts -v

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firmware: [official, unleashed]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build for firmware
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: python3 scripts/install_acun_remote.py --firmware "$FIRMWARE" --build-only
      - name: Package binary and SDK metadata
        env:
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          mkdir -p release-assets
          cp flipper_apps/acun_remote/dist/acun_remote.fap "release-assets/acun_remote-$FIRMWARE.fap"
          cp flipper_apps/acun_remote/dist/build_info.json "release-assets/build_info-$FIRMWARE.json"
      - uses: actions/upload-artifact@v4
        with:
          name: acun-remote-${{ matrix.firmware }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: acun-remote-*
          merge-multiple: true
          path: release-assets
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.fap *.json > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
